<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Practice App</title>
  <style>
    /* Hide screens by default */
    .screen { display: none; }
    /* Show only the active screen */
    .screen.active { display: block; }
  </style>
</head>
<body>

  <!-- 1. MAIN MENU SCREEN -->
  <div id="main-menu" class="screen active">
    <h1>Main Menu</h1>
    <button onclick="showScreen('setup-screen')">Start Practice Setup</button>
    <button onclick="showScreen('scales-manager')">Scales List</button>
  </div>

  <!-- 2. SETUP SCREEN -->
  <div id="setup-screen" class="screen">
    <h2>Practice Setup</h2>
    <!-- Your existing setup controls go here -->
    <button onclick="showScreen('main-menu')">Back to Main Menu</button>
  </div>

  <!-- 3. SCALES LIST MANAGER SCREEN -->
  <div id="scales-manager" class="screen">
    <h2>Scales List</h2>
    <!-- Scale manager UI (dropdown, add, remove, variations) goes here -->
    <button onclick="showScreen('main-menu')">Back to Main Menu</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
